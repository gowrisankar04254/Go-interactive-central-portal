 <!DOCTYPE html>
<html lang="te" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Interactive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header class="gradient-header text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <!-- Gear icon changed to Policy / Info (Admin login removed completely for security) -->
                <button onclick="showPolicies()" title="Portal Policies" class="bg-white/10 p-2.5 rounded-xl backdrop-blur-md border border-white/20 hover:bg-white/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-lg text-blue-200"></i>
                    <span class="text-xs font-medium text-blue-100 hidden sm:inline">Policies</span>
                </button>
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">Go-Interactive Portal</h1>
                    <p class="text-xs text-blue-200 font-medium">Centralized Announcement & Tagged Link Hub</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- Dark / Light Mode Toggle Button -->
                <button onclick="toggleTheme()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-xs font-semibold rounded-xl border border-white/20 transition flex items-center gap-1.5 backdrop-blur-md">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-text" class="hidden sm:inline">Dark</span>
                </button>

                <div class="text-xs text-blue-200 hidden sm:block">
                    <span id="sync-indicator-dot" class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span>
                    <span id="sync-indicator-text">Public Live View</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6">

        <!-- ==================== PUBLIC PORTAL SECTION ==================== -->
        <section id="public-section" class="space-y-6">
            <!-- Search & Filter Bar -->
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 card-shadow flex flex-col sm:flex-row gap-3 justify-between items-center transition-colors">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" onkeyup="filterPosts()" placeholder="Search announcements or links..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                </div>
                <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400 w-full sm:w-auto justify-between sm:justify-end">
                    <span id="post-count" class="font-semibold text-slate-700 dark:text-slate-200">Loading...</span>
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="db-status-badge" class="text-emerald-600 dark:text-emerald-400 font-medium">Ready</span>
                </div>
            </div>

            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- Dynamic Posts -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-800 p-8 transition-colors">
                <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-regular fa-folder-open"></i>
                </div>
                <h3 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">No Announcements Found</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">There are currently no active messages published on the Go-Interactive Portal. Check back soon!</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-4 mt-auto transition-colors">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            <p>&copy; 2026 <span class="font-bold text-slate-700 dark:text-slate-200">Go-Interactive Portal</span>. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC6hYhxuYpVOw3WqaCcQ61p85ezVH8VUEE",
            authDomain: "go-interactive-centralportal.firebaseapp.com",
            projectId: "go-interactive-centralportal",
            storageBucket: "go-interactive-centralportal.firebasestorage.app",
            messagingSenderId: "509446588638",
            appId: "1:509446588638:web:2a981d6bdcca95618b1a4f"
        };

        let db = null;
        let isFirebaseActive = false;
        let cachedPosts = [];

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                isFirebaseActive = true;
            }
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        const STORAGE_KEY = 'go_interactive_portal_posts';

        const initialSamplePosts = [
            {
                id: '1',
                title: 'Welcome to Go-Interactive Portal',
                message: 'This is the central portal for all public announcements and tagged resources.',
                linkText: 'Sample External Document',
                linkUrl: 'https://example.com',
                timestamp: new Date().toISOString()
            }
        ];

        function fetchPosts(callback) {
            if (isFirebaseActive && db) {
                document.getElementById('db-status-badge').textContent = 'Cloud Live Database Active';
                db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                    const posts = [];
                    snapshot.forEach((doc) => {
                        posts.push({ id: doc.id, ...doc.data() });
                    });
                    cachedPosts = posts;
                    if (callback) callback(posts);
                    renderPublicPosts();
                }, (error) => {
                    loadLocalPosts(callback);
                });
            } else {
                document.getElementById('db-status-badge').textContent = 'Live Interactive Preview';
                loadLocalPosts(callback);
            }
        }

        function loadLocalPosts(callback) {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(initialSamplePosts));
                cachedPosts = initialSamplePosts;
            } else {
                try {
                    cachedPosts = JSON.parse(saved);
                } catch (e) {
                    cachedPosts = [];
                }
            }
            if (callback) callback(cachedPosts);
            renderPublicPosts();
        }

        function showPolicies() {
            alert("Go-Interactive Portal Policy:\n- Secure public announcement hub.\n- All contents are verified for users.\n- Admin console is restricted to secure separate route.");
        }

        function renderPublicPosts() {
            const container = document.getElementById('posts-container');
            const emptyState = document.getElementById('empty-state');
            const postCount = document.getElementById('post-count');
            const searchInput = document.getElementById('search-input');
            const query = searchInput ? searchInput.value.toLowerCase() : '';

            const filtered = cachedPosts.filter(p => 
                (p.title && p.title.toLowerCase().includes(query)) || 
                (p.message && p.message.toLowerCase().includes(query))
            );

            postCount.textContent = `${filtered.length} Items Published`;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filtered.map(post => {
                const dateStr = post.timestamp ? new Date(post.timestamp).toLocaleDateString('te-IN', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                }) : 'Today';

                const hasLink = post.linkUrl && post.linkUrl.trim() !== '';
                const linkLabel = post.linkText && post.linkText.trim() !== '' ? post.linkText : 'Open Tagged Link';

                return `
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 card-shadow flex flex-col justify-between hover:border-brand-200 dark:hover:border-brand-700 transition-colors">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 bg-blue-50 dark:bg-blue-950/50 text-brand-600 dark:text-brand-400 rounded-full border border-blue-100 dark:border-blue-900/50">
                                    Announcement
                                </span>
                                <span class="text-[11px] text-slate-400 dark:text-slate-500 font-medium">
                                    <i class="fa-regular fa-clock mr-1"></i>${dateStr}
                                </span>
                            </div>
                            <h3 class="font-bold text-base text-slate-800 dark:text-slate-100 mb-2 leading-snug">${escapeHTML(post.title)}</h3>
                            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-4 whitespace-pre-line">${escapeHTML(post.message)}</p>
                        </div>

                        ${hasLink ? `
                            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 mt-auto">
                                <a href="${escapeHTML(post.linkUrl)}" target="_blank" rel="noopener noreferrer" 
                                   class="inline-flex items-center justify-between w-full px-4 py-2.5 bg-brand-50 hover:bg-brand-100/80 dark:bg-brand-950/40 dark:hover:bg-brand-900/50 text-brand-700 dark:text-brand-300 font-semibold text-xs rounded-xl transition group">
                                    <span class="truncate"><i class="fa-solid fa-arrow-up-right-from-square mr-2 text-brand-500 dark:text-brand-400"></i>${escapeHTML(linkLabel)}</span>
                                    <i class="fa-solid fa-chevron-right text-[10px] text-brand-400 group-hover:translate-x-0.5 transition-transform"></i>
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            const htmlElement = document.getElementById('html-root');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');

            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
                icon.textContent = '🌙';
                text.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
                icon.textContent = '☀️';
                text.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Check saved theme on load
        function loadThemePreference() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const htmlElement = document.getElementById('html-root');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');

            if (savedTheme === 'dark') {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
                if (icon) icon.textContent = '☀️';
                if (text) text.textContent = 'Light';
            } else {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
                if (icon) icon.textContent = '🌙';
                if (text) text.textContent = 'Dark';
            }
        }

        function filterPosts() {
            renderPublicPosts();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.onload = function() {
            loadThemePreference();
            fetchPosts();
        };
    </script>
</body>
</html>
